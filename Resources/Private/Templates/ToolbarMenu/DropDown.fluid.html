<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
      data-namespace-typo3-fluid="true">

<f:asset.module identifier="@cpsit/admiral-cloud-connector/dropdown.js" />

<p class="dropdown-headline">
    <f:translate domain="admiral_cloud_connector.be" key="toolbarItem.title" />
</p>

<ul class="dropdown-list">
    <li>
        <a href="#" id="js-admiral-cloud-toolbar-dropdown-update-changed-metadata" class="dropdown-item">
            <f:translate domain="admiral_cloud_connector.be" key="toolbarItem.updateChangedMetadata.title" />
        </a>
    </li>
    <li>
        <a href="#" id="js-admiral-cloud-toolbar-dropdown-close-connection" class="dropdown-item" title="(AC Group: {ACGroup})">
            <f:translate domain="admiral_cloud_connector.be" key="toolbarItem.closeConnection.title" />
        </a>
    </li>
    <f:if condition="{externalLink.url}">
        <li>
            <a href="{externalLink.url}" class="dropdown-item" target="_blank">
                <f:translate key="{externalLink.label}" />
            </a>
        </li>
    </f:if>
</ul>

</html>
